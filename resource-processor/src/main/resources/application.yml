spring:
  application:
    name: resource-processor
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

rabbitmq:
  exchange: resources.direct
  queue: resources.queue
  routing-key: resources.uploaded
  dead-letter-exchange: resources.dlx
  dead-letter-queue: resources.queue.dlq

retry:
  max-attempts: 3
  initial-interval: 1000
  multiplier: 2.0
  max-delay: 10000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
