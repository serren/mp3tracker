spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  sql:
    init:
      mode: always

eureka:
  client:
    enabled: false

spring.cloud.discovery.enabled: false

retry:
  max-attempts: 1
  initial-interval: 100
  multiplier: 1.0
  max-delay: 100

rabbitmq:
  exchange: resources.direct
  queue: resources.queue
  routing-key: resources.uploaded
  processed-queue: resource.service.queue
  processed-routing-key: resources.processed

aws:
  s3:
    endpoint: http://localhost:4566
    bucket-name: test-bucket
    region: us-east-1
    access-key: test
    secret-key: test

resilience4j:
  circuitbreaker:
    instances:
      storageService:
        enabled: false
